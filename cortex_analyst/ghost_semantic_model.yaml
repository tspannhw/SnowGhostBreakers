verified_queries:
  - name: "Active High Threat Ghosts"
    question: "Show me all active ghosts with high or extreme threat levels"
    sql: "SELECT ghost_name, ghost_type, threat_level, total_sightings FROM GHOST_DETECTION.ANALYTICS.VW_GHOST_ACTIVITY_SUMMARY WHERE status = 'Active' AND threat_level IN ('High', 'Extreme') ORDER BY total_sightings DESC"
    
  - name: "Recent Paranormal Activity"
    question: "What were the most recent ghost sightings?"
    sql: "SELECT ghost_name, location_name, sighting_datetime, paranormal_activity_level FROM GHOST_DETECTION.APP.GHOST_SIGHTINGS JOIN GHOST_DETECTION.APP.GHOSTS USING (ghost_id) ORDER BY sighting_datetime DESC LIMIT 10"
    
  - name: "Critical Hotspots"
    question: "Which locations are critical paranormal hotspots?"
    sql: "SELECT location_name, total_sightings, unique_ghosts, avg_activity_level FROM GHOST_DETECTION.ANALYTICS.VW_PARANORMAL_HOTSPOTS WHERE hotspot_classification = 'Critical Hotspot' ORDER BY total_sightings DESC"
    
  - name: "Evidence Summary"
    question: "How much evidence do we have per ghost?"
    sql: "SELECT ghost_name, evidence_count, ghost_type, threat_level FROM GHOST_DETECTION.ANALYTICS.VW_GHOST_ACTIVITY_SUMMARY WHERE evidence_count > 0 ORDER BY evidence_count DESC"
    
  - name: "Open High Priority Cases"
    question: "Show all open high priority investigations"
    sql: "SELECT investigation_id, case_name, priority, start_date, evidence_count FROM GHOST_DETECTION.APP.INVESTIGATIONS WHERE status IN ('Open', 'In_Progress') AND priority IN ('High', 'Critical') ORDER BY start_date DESC"
