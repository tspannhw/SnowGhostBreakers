[pytest]
# Pytest configuration for Ghost Detection System tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require Snowflake connection)
    slow: Slow running tests
    cortex: Tests requiring Cortex AI
    mcp: Tests for MCP server
    streamlit: Tests for Streamlit app

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# [coverage:run]
# source = streamlit_app,mcp
# omit = */tests/*,*/conftest.py

# Timeout (if using pytest-timeout)
# timeout = 300
# timeout_method = thread

