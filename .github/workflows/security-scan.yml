name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scan
    - cron: '0 2 * * 1'

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Run Gitleaks (Secret Scanning)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit (Python Security Linter)
      run: |
        bandit -r . -f json -o bandit-report.json || true
        cat bandit-report.json
    
    - name: Check for vulnerable dependencies
      run: |
        pip install -r requirements.txt
        safety check --json || true
    
    - name: Verify no credentials in config files
      run: |
        # Check for potential credential files
        if find . -type f \( -name "*.env" ! -name "env.example" ! -name "*.env.example" \) | grep .; then
          echo "ERROR: Found .env files that should not be committed"
          exit 1
        fi
        
        # Check for common credential patterns
        if grep -r -i "password\s*=\s*['\"][^$]" --include="*.py" --include="*.sql" --exclude-dir=".git" .; then
          echo "WARNING: Found potential hardcoded passwords"
          exit 1
        fi
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

